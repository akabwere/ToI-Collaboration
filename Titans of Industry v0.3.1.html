<style>

.cell.hand{background:color-mix(in srgb,var(--gold) 30%,var(--empty));outline:2px solid var(--gold);outline-offset:-2px;box-shadow:0 0 10px 1px color-mix(in srgb,var(--gold) 70%,transparent);color:var(--gold-ink);font-weight:800;z-index:1}

function zoneWeights(c){const d=c?S.dirs[c.dir]:null,f=FOCUS[focusOf(c)],w={};for(const t of ORDER)w[t]=(CFG.zoneBase+(d?(d[ZSTAT[t]]||0):0))*(f.up.includes(t)?CFG.focusMult:1);return w}

// dividends one share of this company pays per turn

const valMult=id=>1+(S.dirs[S.comps[id].dir]?.VAL||0)*CFG.valStep;
const pumpMult=id=>S.pump&&S.pump.id===id&&S.round<S.pump.until?1+RUNCFG.pump:1;   // The Bull Horn

const optionRate=c=>Math.min(CFG.optionCap,CFG.stockOption+CFG.optionPer*(S.dirs[c.dir]?.VAL||0));

function buildFloor(handTile,i){

// ---- setup
function newGame(){

  W=ES.w;H=ES.h;N=W*H;
  const SEATS=[PLAYER_SEAT,...tbl.map(n=>({name:n,...TITANS[n]}))];

    players:SEATS.map((s,i)=>({...s,i,home:i===1,cash:CFG.startCash,hand:[],bench:[],shares:{},founded:false})),
    dirs:{},comps:{},nextC:0,turn:0,round:1,phase:'place',sel:null,bought:0,
    log:[],queue:[],over:null,coLists:SEATS.map((s,i)=>shuffle([...(i===0?PLAYER_CO_NAMES:CO_NAMES[s.name]||PLAYER_CO_NAMES)])),found:null,insp:null,msg:'',cpu:S?S.cpu:true,recent:{},foundFocus:'bal'};

  for(const q of S.players){
    if(q.i===0){q.extraPer=Math.max(staffOf('DEV'),CFG.testDev||0);q.capBonus=CFG.omDesks*staffOf('OM');q.capMult=1;q.divMult=1;q.buyMax=CFG.buyMax+staffOf('SB')+(BM('crypto')?3:0);q.handSize=CFG.hand+staffOf('RB');q.founderShares=1+uwExtra(staffOf('UW'));q.cash+=perkSum('cash');if(BM('oldmoney'))q.cash+=Math.round(CFG.startCash*CFG.oldMoney*abil())}
    else{q.extraPer=CFG.titanExtraPer[b]||0;q.capBonus=0;q.capMult=CFG.titanCapByBoard[b]??1;q.divMult=CFG.titanDivByBoard[b]??1;q.buyMax=CFG.buyMax+(RUN&&league()>=6?1:0);q.handSize=CFG.hand+(CFG.titanHandBonus[b]||0)+(RUN&&league()>=4?1:0);q.founderShares=1;if(RUN&&league()>=2)q.cash+=Math.round(CFG.startCash*RUNCFG.leagueCash);if(q.name==='Oil Barons')q.cash+=Math.round(CFG.startCash*CFG.oldMoney*abil())}}
  for(let j=0;j<Math.round(CFG.seeds*N/140);j++){const t=S.bag.pop();Object.assign(S.grid[t],{placed:true,f:[ORDER[rnd(4)]],wild:true})}

}
// the map's shape and special spaces for this board's Econoscape
function shapeMap(){const t=tw(),at=(x,y)=>y*W+x,G=S.grid;
  const ES=ESCAPES[S.esc];
  if(t==='ring'){const [mx,my]=ES.hole||[6,5];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x>=mx&&x<W-mx&&y>=my&&y<H-my)G[at(x,y)].blocked=true}
  if(t==='lanes'){const br=ES.bridges||[Math.floor(W/4),Math.floor(3*W/4)];for(const y of (ES.dividers||[4,5,10,11]))for(let x=0;x<W;x++)if(!br.includes(x))G[at(x,y)].gate=(ES.dividers||[4,5,10,11]).indexOf(y)%2;else G[at(x,y)].bridge=true;setGates()}
  if(t==='wells'){let n=0;for(let tries=0;n<CFG.wells&&tries<500;tries++){const i=rnd(N);if(G[i].well||n4(i).some(j=>G[j].well)||[...Array(N).keys()].some(j=>G[j].well&&Math.abs(j%W-i%W)+Math.abs(Math.floor(j/W)-Math.floor(i/W))<4))continue;G[i].well=true;n++}}
  if(t==='blvd'){const y=Math.floor(H/2);for(let x=0;x<W;x++)G[at(x,y)].blvd=true}
  if(t==='zones'){S.zones=[];const shapes=[[2,2],[2,3],[3,2],[2,4],[4,2],[3,3]],types=['barracks','armory','bunker','depot','armory','barracks'];
    for(let tries=0;S.zones.length<CFG.zoneCount&&tries<800;tries++){const [w,h]=shapes[rnd(shapes.length)],x0=rnd(W-w),y0=rnd(H-h),cells=[];
      for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)cells.push(at(x,y));
      if(cells.some(i=>G[i].zone!=null||n4(i).some(j=>G[j].zone!=null)))continue;
      const z={id:S.zones.length,type:types[S.zones.length%types.length],cells};S.zones.push(z);for(const i of cells)G[i].zone=z.id}}
}
// Mediscape: finished towers crowned with wild capstones, standing as loose lots
function placeWildCaps(){const at=(x,y)=>y*W+x,cx=Math.floor(W/2),cy=Math.floor(H/2),WC=CFG.wildCaps;
  const mid=ORDER.includes(WC.centerType)?WC.centerType:ORDER[rnd(4)],[a,b,c]=shuffle(ORDER.filter(t=>t!==mid));   // a = the doubled type
  const spots=[[at(2,2),a,WC.corner],[at(W-3,H-3),a,WC.corner],[at(W-3,2),b,WC.corner],[at(2,H-3),c,WC.corner],[at(cx,cy),mid,WC.center]];
  for(const [i,t,k] of spots){const g=S.grid[i];Object.assign(g,{placed:true,f:Array(k+1).fill(t),crown:true,wcap:true,c:null,paid:0,crownPaid:0});delete g.wild;S.bag=S.bag.filter(j=>j!==i)}}
// the boss flagship: a small company already open, led by the home Titan's best defender
function buildFlagship(){
  const p=home(),dirId=p.bench.slice().sort((a,b)=>S.dirs[b].level-S.dirs[a].level||S.dirs[b].DEF-S.dirs[a].DEF)[0],d=S.dirs[dirId];   // led by its level 3 franchise
  const shapes=CFG.flagTiles===3?[[0,1,2],[0,W,2*W],[0,1,W+1],[0,1,W],[0,W,W+1],[1,W,W+1]]:[[0,1,2,W+1],[0,1,W,W+1],[0,1,2,W],[0,W,W+1,W+2]];
  for(let tries=0;tries<200;tries++){
    const x=3+rnd(W-7),y=2+rnd(H-5),base=y*W+x,sh=shapes[rnd(shapes.length)].map(o=>base+o);
    if(sh.some(i=>S.grid[i].placed||S.grid[i].blocked||n4(i).some(n=>!sh.includes(n)&&S.grid[n].placed)))continue;
    for(const i of sh){S.bag.splice(S.bag.indexOf(i),1);Object.assign(S.grid[i],{placed:true,f:[pick(zoneOdds({dir:dirId}))]})}
    const id='c'+S.nextC;
    S.comps[id]={id,name:d.name,color:coColor(p.i),owner:p.i,dir:dirId,hq:sh[0],led:0,earned:0,pend:0,sold:2,alive:true,flagship:true,cap:null,stack:{S:0,A:0,L:0,M:0}};
    S.nextC++;for(const i of sh)S.grid[i].c=id;tcDirty();
    p.bench.splice(p.bench.indexOf(dirId),1);p.founded=true;p.shares[id]=2;
    log(`${poss(bossName())} flagship, ${d.name}, is already open for business.`);return}
}
// The Nepo Baby: you start with a 2-space company; you choose its executive and its HQ lot's type (the second lot is rolled)
function buildNepo(dirId,hqType){const p=S.players[0];if(!free(p).includes(dirId)||!ORDER.includes(hqType))return;
  for(let tries=0;tries<300;tries++){
    const x=1+rnd(W-3),y=1+rnd(H-3),base=y*W+x,sh=(rnd(2)?[0,1]:[0,W]).map(o=>base+o);
    if(sh.some(i=>S.grid[i].placed||S.grid[i].blocked||n4(i).some(n=>!sh.includes(n)&&S.grid[n].placed)))continue;
    for(const i of sh){S.bag.splice(S.bag.indexOf(i),1);Object.assign(S.grid[i],{placed:true,f:[i===sh[0]?hqType:pick(zoneOdds({dir:dirId}))]})}
    const id='c'+S.nextC,name=franchiseName(dirId),fs=Math.min(p.founderShares||1,CFG.shares);
    S.comps[id]={id,name,color:coColor(0),owner:0,dir:dirId,hq:sh[0],led:0,earned:0,pend:0,sold:fs,alive:true,cap:null,born:0,focus:'bal',stack:{S:0,A:0,L:0,M:0}};
    S.nextC++;for(const i of sh)S.grid[i].c=id;tcDirty();
    p.bench.splice(p.bench.indexOf(dirId),1);p.founded=true;ledger(p,id);p.shares[id]=fs;
    log(`The Nepo Baby: Daddy already set you up with ${name}.`);return}
}
// what player i would collect as a top/second holder of company id at price pr (Acquire's 10x/5x, ties split)
function bonusShare(id,i,pr){const hs=S.players.map(p=>({i:p.i,n:p.shares[id]||0})).filter(h=>h.n>0).sort((a,b)=>b.n-a.n);if(!hs.some(h=>h.i===i))return 0;
  const top=hs.filter(h=>h.n===hs[0].n);
  if(top.length>1||hs.length===1)return top.some(h=>h.i===i)?Math.round(pr*15/top.length/100)*100:0;
  if(top[0].i===i)return pr*10;
  const rest=hs.slice(1),sec=rest.filter(h=>h.n===rest[0].n);return sec.some(h=>h.i===i)?Math.round(pr*5/sec.length/100)*100:0}
// next = the round the drawn tiles will first be played in
function refill(p,next=S.round){
  // dead tiles (touching two safe companies) leave the draw pile, and any in hand are discarded

  // Mediscape insurance: both owners are paid for their fallen units

    for(const [o,n] of [[Wc.owner,fw],[L.owner,fl]]){if(!n)continue;const q=S.players[o],v=n*CFG.insurePay;q.cash+=v;LEDGER?.push({i:o,amt:v,why:`insurance on ${n} fallen`});if(!FSEED)log(`Insurance: ${q.name} collected ${money(v)} for ${n} fallen employees.`)}}
  // Free Agency: Sports Entertainment signs part of the beaten army into its nearest company
  for(const sp of S.players.filter(q=>hasT(q,'freeagency'))){if(r&&L.owner!==sp.i){const li=r.ids[0]===lose?0:1,dist=x=>{const a=x.hq,b_=L.hq;return Math.abs(a%W-b_%W)+Math.abs(Math.floor(a/W)-Math.floor(b_/W))};
    const tgt=mineOf(sp).filter(x=>x.id!==lose&&x.id!==win).sort((x,y)=>dist(x)-dist(y))[0];
    if(tgt){let signed=0;for(const t of ORDER){const n=Math.min(Math.floor(r.start[li][t]*CFG.freeAgency*abil()),capacity(tgt)-units(tgt));if(n>0){tgt.stack[t]+=n;signed+=n}}
      if(signed&&!FSEED)log(`Free Agency: ${tgt.name} signed ${signed} of ${L.name}'s laid-off staff.`)}}}
  // The Short King: a Tertiary Bonus when a company you hold no stock in loses a Hostile Takeover
  if(r&&BM('shortking')&&L.owner!==0&&!S.players[0].shares[lose]){const me=S.players[0],b=Math.round(pr*2.5/10)*10;me.cash+=b;LEDGER?.push({i:0,amt:b,why:'Tertiary Bonus (Short King)'});if(!FSEED)log(`The Short King collects a ${money(b)} Tertiary Bonus as ${L.name} falls.`)}
  const held=[];
  for(const p of S.players){const n=p.shares[lose]||0;if(!n)continue;
    if(!r){held.push({p,n});delete p.shares[lose];continue}
    const ep=(pill&&upset&&p.i===0)||(dcUp&&p.i===L.owner)?pr:cpr;p.cash+=n*ep;if(!FSEED)ledger(p,lose).got+=n*ep;LEDGER?.push({i:p.i,amt:n*ep,why:`${shs(n)} cashed out${upset&&ep<pr?' at fire-sale price':''}`});delete p.shares[lose]}
  // the land and its buildings
  let scrap=0,torn=0;
  for(const i of tilesOf(lose)){const g=S.grid[i];
    if(r&&g.f.length>1&&!g.wcap){scrap+=(g.paid||0)*CFG.selloffRate;torn+=g.f.length-1+(g.crown?1:0);g.f=[g.f[0]];g.crown=false;g.paid=0;g.crownPaid=0}
    g.c=win}
  tcDirty();
  if(torn){const v=Math.round(scrap/10)*10;S.players[Wc.owner].cash+=v;LEDGER?.push({i:Wc.owner,amt:v,why:`${torn} floor${torn>1?'s':''} sold for scrap`});if(!FSEED)log(`${Wc.name} tore down ${L.name}'s towers and sold them for scrap: ${money(v)} to ${S.players[Wc.owner].name}.`)}
  if(!r&&L.cap){
    // friendly merger: the survivor keeps its own capstone; the other loses its crown and refunds part of its cost
    if(Wc.cap){const g=S.grid[L.capAt],v=Math.round((g.crownPaid||0)*CFG.capRefund/10)*10;g.crown=false;g.paid=Math.max(0,(g.paid||0)-(g.crownPaid||0));g.crownPaid=0;ctl.cash+=v;LEDGER?.push({i:ctl.i,amt:v,why:`${TYPES[L.cap].cap} decommissioned`});if(!FSEED)log(`${L.name}'s ${TYPES[L.cap].cap} lost its crown in the merger; ${ctl.name} recovered ${money(v)}.`)}
    else{Wc.cap=L.cap;Wc.capAt=L.capAt}}
  capDedupe();
  const d=S.dirs[L.dir];
  if(r){
    const li=r.ids[0]===lose?0:1,laid=ORDER.reduce((a,t)=>a+r.start[li][t],0),sevX=ctl.i===0&&BM('severance')&&!S.used?.sev?3:1,sev=laid*CFG.severance*sevX;if(sevX>1&&!FSEED)S.used.sev=true;
    ctl.cash+=sev;if(sev)LEDGER?.push({i:ctl.i,amt:sev,why:'restructuring charge'});
    const freeAgent=(chute||dcUp)&&lTier>=CFG.chuteNoNC;
    Wc.stack={...r.surv};ctl.bench.push(d.id);const noNC=freeAgent||(ctl.i===0&&BM('loophole'));if(!noNC)d.nc=S.round+CFG.nonCompete-1;
    if(laid&&!FSEED)log(`${laid} employees of ${L.name} were laid off. ${ctl.name} pocketed ${money(sev)} in restructuring charges.`);
    if(!FSEED)log(noNC&&!freeAgent?`${d.name} returns to ${ctl.name}; the Loophole voids the non-compete.`:freeAgent?`${d.name} floats back to ${ctl.name} on a golden parachute, free to lead again right away.`:`${d.name} returns to ${ctl.name} under a ${CFG.nonCompete}-round non-compete clause.`);
  } else {
    for(const t of ORDER)Wc.stack[t]+=L.stack[t];
    ctl.bench.push(d.id);if(L.flagship)Wc.flagship=true;
  }
  for(const {p,n} of held){
    if(p.i===0&&!HEADLESS&&!FSEED&&!isAI(p)){PEND={n,pr,win,lose,name:L.name};continue}
    settleTrade(p,lose,win,n,Math.floor(tradeMax(win,n,pr)*CFG.aiTradeShare),pr)}
  if(r&&L.flagship&&!S.flagFell){S.flagFell={round:S.round,by:Wc.owner};if(!FSEED)log(`${poss(bossName())} flagship ${L.name} has fallen to ${S.players[Wc.owner].name}!`)}
  L.alive=false;
}

// ---- battles
// a unit's numbers: director stat x unit type x land bonus
function ustat(c,t){const d=S.dirs[c.dir],m=TYPES[t],lb=landBonus(c.id);return {atk:d.ATK*m.atk*2*(1+lb.S)*(t==='M'&&tw()==='ring'?CFG.ringAdMen:1)*(1+zoneFx(c).dmg),def:d.DEF*m.def*(1+lb.L),hp:CFG.baseHP*m.hp}}
function power(c){return ORDER.reduce((a,t)=>{const u=ustat(c,t);return a+c.stack[t]*u.atk*u.hp},0)}
// fighting slots per line: base + DEF lead; a Law Fortress adds slots for itself and takes them from the attacker when it is defending
function frontWidths(C,attacker){const B=CFG.frontBase,fmax=Math.max(...CFG.fortressSlots),d=C.map(c=>S.dirs[c.dir].DEF);
  const w=[B+CFG.frontK*(d[0]-d[1]),B+CFG.frontK*(d[1]-d[0])];
  for(let s=0;s<2;s++)if(hasCap(C[s],'L')&&C[s].owner!==attacker){const f=capVal(CFG.fortressSlots,C[s],'L');w[s]+=f;w[1-s]-=f}
  for(let s=0;s<2;s++)if(C[s].owner!==attacker)w[s]+=Math.round(zoneFx(C[s]).slots);   // Battlescape bunkers
  return w.map(x=>Math.max(1,Math.min(2*B+fmax,Math.round(x))))}
// v0.3.1 fix: within a line, unit types that counter the enemy's living army step up first
// (score = enemy units this type beats minus enemy units that beat it; ties keep the old alternating order)
function counterPri(foe){const o={};if(!foe){for(const t of ORDER)o[t]=0;return o}
  for(const t of ORDER)o[t]=-((foe[TYPES[t].beats]||0)-ORDER.filter(x=>TYPES[x].beats===t).reduce((a,x)=>a+(foe[x]||0),0));return o}
// pooled slots: 3 x w, dealt out one per line in turn so every line gets a share
function engaged(live,w,foe){const pr=counterPri(foe),L=[0,1,2].map(k=>live.filter(u=>u.line===k).sort((x,y)=>pr[x.t]-pr[y.t]));
  const take=[0,0,0];let slots=3*w,more=true;while(slots>0&&more){more=false;for(let k=0;k<3&&slots>0;k++)if(take[k]<L[k].length){take[k]++;slots--;more=true}}
  return L.flatMap((l,k)=>l.slice(0,take[k]))}
// damage per hit: a percentage cut by defense
const dmgF=(a,df)=>a*CFG.dmgScale*CFG.defK/(CFG.defK+df);
function battle(ia,ib){
  const C=[S.comps[ia],S.comps[ib]],attacker=S.turn;
  const st=C.map(c=>Object.fromEntries(ORDER.map(t=>[t,ustat(c,t)])));
  for(let s=0;s<2;s++)if(C[s].owner===0&&BM('poster')&&!S.used?.poster)for(const t of ORDER)st[s][t].atk*=1.3;   // The Motivational Poster
  const U=C.map((c,s)=>{const a=[],left={...c.stack};let more=true;while(more){more=false;for(const t of ORDER)if(left[t]>0){left[t]--;more=true;a.push({t,hp:st[s][t].hp,line:TYPES[t].line})}}return a});
  const Wd=frontWidths(C,attacker),mall=C.map(c=>hasCap(c,'S')?capVal(CFG.mallSplash,c,'S'):0);
  const snap=()=>U.map(us=>{const o={S:0,A:0,L:0,M:0};for(const u of us)if(u.hp>0)o[u.t]++;return o});
  const rank=(a,t)=>TYPES[a].beats===t?0:TYPES[t].beats===a?2:1;
  const mult=(a,t)=>TYPES[a].beats===t?2:TYPES[t].beats===a?.5:1;
  const R=seeded((FSEED||0)*15485863+S.round*7919+S.turn*104729+(S.lastTile||0)*131+parseInt(ia.slice(1))*31+parseInt(ib.slice(1))*17);
  const rounds=[snap()],field=[];let r=0;
  while(U[0].some(u=>u.hp>0)&&U[1].some(u=>u.hp>0)&&r<100){
    r++;const ot=r>5?1+.25*(r-5):1,hits=[];
    const now=snap(),act=U.map((us,s)=>engaged(us.filter(u=>u.hp>0),Wd[s],now[1-s]));
    // what each side has on the field this round, by unit type: fighting / waiting in reserve
    field.push(U.map((us,s)=>{const on=new Set(act[s]),o={};for(const t of ORDER){const L=us.filter(u=>u.hp>0&&u.t===t),a=L.filter(u=>on.has(u)).length;o[t]={act:a,res:L.length-a}}return o}));
    for(let s=0;s<2;s++){
      const e=1-s,pend=new Map(),T={};
      const standing=[0,1,2].filter(k=>U[e].some(u=>u.hp>0&&u.line===k));
      const pool=d=>{if(T[d])return T[d];const reach=standing.slice(0,d),byT={};for(const t of ORDER)byT[t]=act[e].filter(u=>u.t===t&&reach.includes(u.line));return T[d]={byT,ptr:{S:0,A:0,L:0,M:0}}};
      for(const u of act[s]){
        const P=pool(u.line===0?1:u.line===1?CFG.strikeReach:3),byT=P.byT,ptr=P.ptr;
        const pref=ORDER.slice().sort((x,y)=>rank(u.t,x)-rank(u.t,y)),done=new Set();
        const base=u.t==='M'?2:1,n=base+(mall[s]?1:0);
        for(let h=0;h<n;h++){let tg=null;
          for(const t of pref){const L=byT[t];let j=ptr[t];while(j<L.length&&(done.has(L[j])||L[j].hp-(pend.get(L[j])||0)<=0))j++;if(h===0)ptr[t]=j;if(j<L.length){tg=L[j];break}}
          if(!tg)for(const t of pref){const c=byT[t].filter(x=>!done.has(x));if(c.length){tg=c[c.length-1];break}}
          if(!tg)break;done.add(tg);
          const dmg=dmgF(st[s][u.t].atk,st[e][tg.t].def)*mult(u.t,tg.t)*ot*(0.8+R()*0.4)*(h>=base?mall[s]:1);
          pend.set(tg,(pend.get(tg)||0)+dmg);hits.push([tg,dmg])}
      }
    }
    for(const [tg,d] of hits)tg.hp-=d;
    rounds.push(snap());
  }
  const left=U.map(us=>us.filter(u=>u.hp>0).length);
  const winner=left[0]>left[1]?0:left[1]>left[0]?1:(size(ia)>=size(ib)?0:1);
  return {ids:[ia,ib],names:C.map(c=>c.name),owners:C.map(c=>S.players[c.owner].name),colors:C.map(c=>S.players[c.owner].color),ccolors:C.map(c=>c.color),
    dirs:C.map(c=>`${S.dirs[c.dir].name===c.name?'':S.dirs[c.dir].name+' · '}level ${S.dirs[c.dir].level}`),caps:C.map(capsOf),attacker,rounds,start:rounds[0],surv:rounds[rounds.length-1][winner],winner,field,widths:Wd};
}

// ---- stock
const noBuy=(p,c)=>p.i===0&&BM('shortking')&&c.owner!==0;   // The Short King
function buy(id){const p=cur(),c=S.comps[id],pr=costOf(p,id);if(pr>p.cash||!c?.alive||CFG.shares-c.sold<=0||noBuy(p,c)||trending(id))return;const g=gougeRate(p,c);if(g){const mk=pr-Math.round(pr/(1+g)/10)*10;S.players[c.owner].cash+=mk}if(p.i===0){if(BM('impulse'))S.impUsed=true;if(BM('ffd')&&c.owner!==0)S.ffdUsed=true}p.cash-=pr;p.shares[id]=(p.shares[id]||0)+1;c.sold++;S.bought++;ledger(p,id).paid+=pr}
function tick(){if(FSEED||!S.hist)return;const pr={};for(const c of alive())pr[c.id]=price(c.id);S.hist.push({r:S.round,s:S.turn,p:pr})}
function tickDeath(id,pr,cpr,upset,by){if(FSEED||!S.hist)return;S.deaths[id]={x:S.hist.length-.5,pr,cpr,upset,by}}

// ---- end-of-board score: cash + every share sold + layoffs, x the monopoly bonus
const corpTiles=()=>{let n=0;for(let i=0;i<N;i++){const c=S.grid[i].c;if(c!=null&&S.comps[c]?.alive)n++}return n};
const monopoly=p=>{const t=corpTiles();return t?mineOf(p).reduce((a,c)=>a+size(c.id),0)/t:0};
function wealthOf(p){const stock=Object.entries(p.shares).reduce((a,[id,n])=>a+(S.comps[id]?.alive?n*price(id)*(p.i===0&&BM('baron')&&S.comps[id].owner!==0?.75:1):0),0);
  const adv=CFG.benchVal?p.bench.reduce((a,id)=>a+(S.dirs[id].VAL||0),0)*CFG.benchVal:0,stockSold=Math.round(stock*(1+adv));
  const staff=mineOf(p).reduce((a,c)=>a+units(c),0),lay=staff*CFG.layoffPay*(p.i===0&&BM('pink')?3:1),sub=p.cash+stockSold+lay,m=monopoly(p),mult=1+CFG.monoK*(p.i===0&&BM('baron')?2:1)*m;
  return {cash:p.cash,stock:stockSold,adv,staff,lay,sub,m,mult,total:Math.round(sub*mult)}}
function endTurn(){
  {const p=cur(),n=(S.logTotal||0)-(S.turnLogTotal||0);if(p.i!==0){S.moves??={};S.moves[p.i]=S.log.slice(0,Math.min(n,S.log.length)).reverse()}else S.moves={}}
  refill(cur(),S.round+1);tick();
  S.turn=(S.turn+1)%S.players.length;
  if(S.turn===0){S.round++;if(CFG.roundLimit&&S.round>CFG.roundLimit){endGame('time');return}if(bellLeft())log(`🔔 Closing bell: ${bellLeft()===1?'final round!':bellLeft()+' rounds left.'}`);roundEvents()}
  const co=alive();
  if(co.length&&(co.some(c=>size(c.id)>=CFG.endSize)||co.every(c=>size(c.id)>=CFG.safe))){endGame('acquire');return}
  if(!S.bag.length&&S.players.every(p=>!p.hand.some(canPlay))){endGame('tiles');return}
  if(!S.players[0].bench.length&&!mineOf(S.players[0]).length){endGame('fired');return}
  startTurn();
}
// one-off Board Member triggers at the start of a round
function roundEvents(){const me=S.players[0];
  if(tw()==='lanes'){setGates();log(`🚧 The ${S.openGate?'south':'north'} freeway divider opens this round; the ${S.openGate?'north':'south'} one closes.`)}
  if(S.round===10&&BM('allowance')){me.cash+=2500;log('The Allowance: allowance day, +$2,500.')}
  if(BM('yield')&&bellLeft()===CFG.bellRounds){let v=0;for(const [id,n] of Object.entries(me.shares))if(S.comps[id]?.alive)v+=n*divPerShare(id)*2;if(v){me.cash+=v;log(`The Yield Sign: a closing-bell double dividend of ${money(v)}.`)}}}
// one-off checks that can fire any time
function bmTick(){const me=S.players[0];if(!S.used)return;
  if(BM('gross')&&!S.used.gross&&mineOf(me).some(c=>size(c.id)>=10)){S.used.gross=true;me.cash+=1000;log('The Gross Margin: a company of yours reached 10 spaces. +$1,000 windfall.')}}
// Nutriscape: each company of p sprouts one lot onto an open neighbor that touches no other company
function sproutAll(p){if(FSEED)return;for(const c of mineOf(p)){if((c.led||0)%CFG.sproutEvery)continue;const opts=[];
    for(const i of tilesOf(c.id))for(const n of n4(i))if(canPlay(n)&&!opts.includes(n)&&adjComps(n).every(x=>x===c.id))opts.push(n);
    if(!opts.length)continue;const t=opts[rnd(opts.length)];
    const bi=S.bag.indexOf(t);if(bi>=0)S.bag.splice(bi,1);for(const q of S.players){const k=q.hand.indexOf(t);if(k>=0)q.hand.splice(k,1)}
    Object.assign(S.grid[t],{placed:true,f:[pick(zoneOdds(c))]});for(const i of looseGroup(t)){const g=S.grid[i];if(i!==t&&g.wild)g.f[0]=pick(zoneOdds(c));g.wild=false;g.c=c.id}tcDirty();capDedupe()}}
function endGame(why){
  S.pump=null;S.trend=null;   // temporary boosts never count in the final tally
  // The Silent Partner: Acquire-style end bonuses on every surviving company
  if(BM('silent')&&why!=='forfeit'){const me=S.players[0];for(const c of alive()){const b=bonusShare(c.id,0,price(c.id));if(b){me.cash+=b;ledger(me,c.id).got+=b;log(`The Silent Partner collects a ${money(b)} bonus from ${c.name}.`)}}}
  const Wl=S.players.map(wealthOf);
  for(const p of S.players)for(const [id,n] of Object.entries(p.shares))if(n&&S.comps[id]?.alive)ledger(p,id).got+=n*price(id);
  const stand=S.players.map(p=>({p,nw:Wl[p.i].total,w:Wl[p.i]})).sort((a,b)=>b.nw-a.nw);
  const reason={acquire:`The board is settled. ${stand[0].p.name} ends with the most wealth.`,
    tiles:`The city is built out. ${stand[0].p.name} ends with the most wealth.`,
    fired:'You have no franchises and no companies left. The board is lost.',
    forfeit:'You abandoned the run.',
    time:`🔔 The closing bell rings after ${CFG.roundLimit} rounds. ${stand[0].p.name} ends with the most wealth.`}[why];
  S.over={why,reason,stand};S.phase='over';log(reason);
}

// ===================== 4. TITAN AI =====================
const aiOf=p=>TITAN_AI[p.name]||{};
const rivalsByWorth=p=>S.players.filter(q=>q!==p).sort((a,b)=>netWorth(b)-netWorth(a));
function groups(cids){const g={};for(const c of cids){const o=S.comps[c].owner;(g[o]??={owner:+o,ids:[],pow:0});g[o].ids.push(c);g[o].pow+=power(S.comps[c])}return Object.values(g)}
function rankIn(p,id){const hs=S.players.map(q=>({i:q.i,n:q.shares[id]||0})).filter(h=>h.n>0).sort((a,b)=>b.n-a.n);const k=hs.findIndex(h=>h.i===p.i);return k<0?99:hs.filter(h=>h.n>hs[k].n).length}
function estGain(p,id){const n=p.shares[id]||0;if(!n)return 0;const pr=price(id),r=rankIn(p,id);return n*pr+(r===0?pr*10:r===1?pr*5:0)}
// a company is threatened when a bigger rival is one empty space away
function threatened(c){const sz=size(c.id);for(const i of tilesOf(c.id))for(const e of n4(i)){if(S.grid[e].placed)continue;for(const k of n4(e)){const g=S.grid[k];if(g.c&&g.c!==c.id&&S.comps[g.c].owner!==c.owner&&size(g.c)>sz)return true}}return false}
// how good a tile is for player p
// Titans value twist spaces a little: wells, the Boulevard, zone spaces
const twistBonus=t=>{const g=S.grid[t];return (g.well?15:0)+(g.blvd?6:0)+(g.zone!=null?4:0)+(tw()==='wcap'?looseGroup(t).filter(j=>j!==t&&S.grid[j].wcap).reduce((a,j)=>a+10*(S.grid[j].f.length-1),0):0)};
function evalTile(p,t){
  if(!canPlay(t))return -999;
  const cids=adjComps(t),nb=n4(t).some(n=>S.grid[n].placed),ai=aiOf(p);
  const tb=twistBonus(t);
  if(!cids.length)return nb?(free(p).length?(ai.found??70)+tb:1):5;
  const gs=groups(cids);
  if(gs.length===1){
    if(gs[0].owner===p.i)return 60+tb+(ai.grow||0)-Math.min(20,size(cids[0]))*.5+(cids.length>1?-5:0);
    const sh=cids.reduce((a,c)=>a+(p.shares[c]||0),0);if(sh)return 30+sh*2;
    const anyStock=Object.entries(p.shares).some(([id,n])=>n&&S.comps[id]?.alive&&S.comps[id].owner!==p.i);
    return anyStock?6-size(cids[0])*.3:20-size(cids[0]);
  }
  const mine=gs.find(g=>g.owner===p.i);
  // what my stock in the losing companies gains (bonus) or loses (fire sale) if this side wins
  const swing=win=>{const ws=win.ids.reduce((a,c)=>a+size(c),0);let s=0;
    for(const g of gs)if(g!==win)for(const c of g.ids){const n=p.shares[c]||0;if(!n)continue;if(size(c)>ws)s-=n*price(c)*(1-CFG.fireSaleRate);else s+=estGain(p,c)-n*price(c)}
    if(CFG.htJackpot)for(const g of gs)if(g!==win)for(const c of g.ids)if(size(c)>ws&&size(c)>=CFG.safe)for(const w of win.ids){if(S.comps[w].owner===p.i)s+=10*price(c)*CFG.htJackpot;else if(p.shares[w]){const r=rankIn(p,w);s+=(r===0?10:r===1?5:0)*price(c)*CFG.htJackpot}}
    return s};
  if(mine){if(!gs.every(g=>g===mine||mine.pow>g.pow*(ai.edge??1.15)))return -100;const sec=ai.huntSecond&&rivalsByWorth(p)[1];return Math.max(-50,90+swing(mine)/150+(sec&&gs.some(g=>g.owner===sec.i)?ai.huntSecond:0))}
  const top=gs.reduce((a,b)=>b.pow>a.pow?b:a),gain=swing(top);
  return gain>0?40+gain/200:gain<0?-15+gain/200:-15;
}

      if(S.bonus&&p.i===0){const sp=expandSpots(p);const t=sp.sort((a,b)=>evalTile(p,b)-evalTile(p,a))[0];
        if(t==null||evalTile(p,t)<CFG.bonusMin){S.bonus=false;p.extraLeft=0;afterTower();continue}
        placeTile(t,chooseType(p,t));continue}
      const ok=p.hand.filter(canPlay);

      const t=ok.sort((a,b)=>evalTile(p,b)-evalTile(p,a))[0],type=chooseType(p,t);

// ---- merger payouts, worked out before the fight (v0.23)
// a merger is one of three types; Golden Parachutes and Jackpots only change how a payout works
const MKIND={ht:{name:'Hostile Takeover',rule:"Bigger company wins: the beaten company's top shareholders get 10× and 5× its share price, and its boss gets no bonus.",cls:'mk-ht'},
  fs:{name:'Fire Sale',rule:"Smaller company wins: the beaten company's shares pay half price and nobody gets a bonus.",cls:'mk-fs'},
  fm:{name:'Friendly Merger',rule:"Same owner: outside shareholders collect the bonuses; the owner gets none and converts their shares.",cls:'mk-fm'}};
const SHAREWHY=/cashed out|sold off as ousted|paid in cash|converted into/;

// plays the merger out on a copy of the game once per possible winner and records every payment
function payoutOutcomes(t,type){
  const saved=S,json=JSON.stringify(S),outs=[];
  const run=k=>{S=JSON.parse(json);FSEED=-1;const L=[];LEDGER=L;PEND=null;const g=S.grid[t];g.placed=true;g.f=[type];
    const byOwner={};for(const c of adjComps(t))(byOwner[S.comps[c].owner]??=[]).push(c);
    const cont=[];for(const o in byOwner){const list=byOwner[o].sort((a,b)=>size(b)-size(a));sisterMerge(list);cont.push(list[0])}
    cont.sort((a,b)=>size(b)-size(a));let info={};
    if(cont.length>1){const ids=[cont[0],cont[1]],w=ids[k],l=ids[1-k],st=ids.map(id=>({...S.comps[id].stack}));
      info={kind:size(l)>size(w)?'fs':'ht',win:w,winName:S.comps[w].name,loseName:S.comps[l].name,multi:cont.length>2};
      absorb(w,l,{ids,start:st,surv:{...st[k]},winner:k})}
    return {...info,ledger:L}};
  try{if(new Set(adjComps(t).map(c=>S.comps[c].owner)).size<2)outs.push({...run(0),kind:'fm'});else outs.push(run(0),run(1))}
  finally{S=saved;FSEED=0;LEDGER=null;PEND=null;tcDirty()}
  return outs}

  return `<h3>Money from this merger</h3><div class="money">${rows.length?rows.join(''):'<div class="small muted">No money changed hands. Nobody held stock in the losing company and it had no units to lay off.</div>'}</div>`;

    <p class="small muted" style="margin:10px 0 0">ATK and DEF make a company's units hit harder and take less damage, and DEF wins more fighting slots. VAL raises its share price and the dividends it pays everyone holding its stock. RVN raises its revenue: ${money(CFG.rvnRate)} a turn per point, growing with its size. Level is how tall its towers can go, and a tower crowned at that height gets a capstone of the same tier. Every lot a franchise's company takes in leans toward its strongest stats.</p>

    <h2 style="margin-top:16px">The Sales Floor</h2><div class="wealthbox"><span>Wealth to spend <b>${money(M.capital)}</b></span><span>Total Wealth earned, all runs <b>${money(M.lifetime||0)}</b></span><span>Runs ${M.runs} · won ${M.wins}</span></div>

// ===================== 5. INTERFACE (map-first layout) =====================
// The screen: a top bar (status, your hand, panel buttons), the map filling the middle, and a bar of the four players at the bottom.

const UI={panel:null,ticker:false,autoKey:null,endArm:false,sort:'value',pin:null,hover:null,inspOpen:false,legend:false,sac:null,ftype:null};
const icon=(t,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[t]}</svg>`;
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
// a Titan's insignia as a small CSS swatch
const insCSS=o=>{const c=o.color,a=o.alt||c,P={stripes:`repeating-linear-gradient(45deg,${c} 0 4px,${a} 4px 6px)`,diag:`linear-gradient(60deg,${c} 40%,${a} 40% 60%,${c} 60%)`,rows:`repeating-linear-gradient(0deg,${c} 0 3px,${a} 3px 5px)`,grid:`repeating-linear-gradient(0deg,${a} 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,${a} 0 1px,${c} 1px 4px)`,dots:`radial-gradient(${a} 1.4px,${c} 1.6px) 0 0/5px 5px`,checks:`conic-gradient(${a} 25%,${c} 0 50%,${a} 0 75%,${c} 0) 0 0/6px 6px`,cross:`linear-gradient(${a},${a}) center/8px 3px no-repeat,linear-gradient(${a},${a}) center/3px 8px no-repeat,${c}`,chevron:`repeating-linear-gradient(135deg,${c} 0 3px,${a} 3px 5px)`};return `background:${P[o.pat]||c}`};
const myTurn=()=>S&&S.players&&cur().i===0&&!isAI(cur())&&S.phase!=='over';
// one line describing a lot: its foundation, its tower and its capstone
function tileDesc(g){if(!g.placed)return 'open land';if(g.wild)return 'Unzoned lot (wildcard)';
  const t=towerType(g);return `${TYPES[g.f[0]].name}${t?` · ${g.crown?(g.wcap?'wild ':'')+TYPES[t].cap:TYPES[t].tower} (${plural(g.f.length-1,'floor')})`:''}`}
// only builds you can afford are marked ▲/♛ on the map and can be selected there
function buildMap(){const m=new Map();if(S.phase!=='tower'||isAI(cur()))return m;for(const o of affordable(cur(),buildOptions(cur())))m.set(o.i,o);return m}
function chosenBuild(){const bm=buildMap();return S.tTarget!=null?bm.get(S.tTarget):null}
const floorTypeOf=o=>o?(towerType(S.grid[o.i])||S.grid[o.i].f[0]):null;
// the build list: crowns and taller floors one by one; new towers grouped by company and lot type (the HQ lot first)
function listBuilds(opts){const out=[],seen=new Map();
  for(const x of opts){if(x.kind==='floor'&&x.h===1){const t=S.grid[x.i].f[0],k=x.c.id+t;if(!seen.has(k)){const all=opts.filter(y=>y.c===x.c&&y.kind==='floor'&&y.h===1&&S.grid[y.i].f[0]===t),first=all.find(y=>y.i===x.c.hq)||all[0];seen.set(k,1);out.push({...first,group:all.length})}}else out.push(x)}
  return out.sort((a,b)=>(a.kind==='crown'?0:a.group?2:1)-(b.kind==='crown'?0:b.group?2:1))}
// can the player still buy a share this turn? (drives the end-turn warning)
// founded within the last round of turns
const isNew=c=>c.born!=null&&S.hist&&S.hist.length-c.born<S.players.length;
const canBuyAny=p=>S.bought<(p.buyMax||CFG.buyMax)&&alive().some(c=>CFG.shares-c.sold>0&&costOf(p,c.id)<=p.cash&&!noBuy(p,c)&&!trending(c.id));
// selling back to the bank: The Pawn Star (1 a turn) or The Crypto Bro (any number)
const sellPrice=(p,id)=>S.comps[id]?.owner===p.i?costOf(p,id):price(id);   // your own companies sell back at the option price
const canSell=(p,id)=>p.i===0&&!isAI(p)&&S.phase==='post'&&(p.shares[id]||0)>0&&S.comps[id]?.alive&&(BM('crypto')||(BM('pawn')&&(S.sold||0)<1));
// a pie chart: segments [{v, color, on}] sized by value
function pieSvg(segs,d){const tot=segs.reduce((a,s)=>a+s.v,0)||1,r=d/2-3,cx=d/2,cy=d/2,live=segs.filter(s=>s.v>0);let a0=-Math.PI/2,out='';
  if(live.length===1)out=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${live[0].color};stroke:var(--panel);stroke-width:1.5"/>`;
  else for(const s of live){const a1=a0+s.v/tot*2*Math.PI,lg=a1-a0>Math.PI?1:0;
    out+=`<path d="M${cx} ${cy} L${(cx+r*Math.cos(a0)).toFixed(2)} ${(cy+r*Math.sin(a0)).toFixed(2)} A${r} ${r} 0 ${lg} 1 ${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)} Z" style="fill:${s.color};stroke:${s.on?'var(--ink)':'var(--panel)'};stroke-width:${s.on?2.5:1.5}"/>`;a0=a1}
  return `<svg class="pie" width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" aria-hidden="true">${out}</svg>`}

// ---- top bar
function renderMeta(){const el=$('#meta');if(!el||!S.players)return;const me=S.players[0],p=cur();
  el.innerHTML=`<span class="tb-title">Titans of Industry</span><span>Cash <b>${money(me.cash)}</b></span>${S.phase!=='over'?`<span title="Estimated end value if the level ended now: yours against the home Titan's">Net worth <b>${money(wealthOf(me).total)}</b> vs ${home().name} <b>${money(wealthOf(home()).total)}</b></span>`:''}<span>Round <b>${Math.min(S.round,CFG.roundLimit)}</b>/${CFG.roundLimit}${bellLeft()?` <b class="bell">🔔 ${bellLeft()===1?'final round':bellLeft()+' rounds left'}</b>`:''}</span><span>Tiles left <b>${S.bag.length}</b></span><span>Turn: <b><i class="sw own" style="background:${p.color};border-color:${p.color};vertical-align:-1px"></i> ${p.name}</b></span>${RUN?`<span><button class="esclink" data-act="panel" data-p="esc" aria-pressed="${UI.panel==='esc'}" title="What this Econoscape does">${escName()} ⓘ</button> · Board <b>${RUN.board+1}</b>/${BOARDS.length}${S.hasFlag?' · <b>Boss</b>':''}</span>`:''}`;

  const tb=document.querySelector('#topbar [data-act="ticker"]');if(tb&&tb.setAttribute)tb.setAttribute('aria-pressed',String(UI.ticker));

function renderHand(){const el=$('#hand');if(!el||!S.players)return;const p=cur(),me=S.players[0],my=myTurn();
  if(my&&S.phase==='place'&&devMode(p)){el.innerHTML='<span class="small muted">Developer bonus: pick a + space on the map</span>';return}
  const o=my&&S.phase==='tower'?chosenBuild():null;

// returns {label, act, t, dis, note, warn, chips} or null to hide it
function actionState(){const p=cur();
  if(RUN&&RUN.screen!=='board')return null;
  if(S.phase==='over')return null;
  if(!myTurn())return {label:isAI(p)?`${p.name} is moving…`:'Please wait',dis:true};
  if(S.pm||S.dp||S.queue.length||S.phase==='found'||S.nepoPending)return null;
  if(S.phase==='place'){
    if(S.bonus){if(S.sel==null)return {label:'Skip bonus step',act:'passbonus'};return {label:`Place step at ${coord(S.sel)}`,act:'place',t:'?'}}
    if(S.sel==null)return {label:'Place tile',dis:true,note:'Pick a tile from your hand or a glowing space.'};
    if(foundsCo(S.sel,p))return {label:UI.ftype?`Found ${TYPES[UI.ftype].name}`:'Choose a type',act:'place',t:UI.ftype||'',dis:!UI.ftype,chips:true};
    if(isBattle(S.sel))return {label:`Review merger at ${coord(S.sel)}`,act:'place',t:'?',danger:true};
    return {label:`Place ${coord(S.sel)}`,act:'place',t:'?'}}
  if(S.phase==='tower'){const o=chosenBuild();
    if(!o)return {label:'Skip building',act:'skiptower',note:'Or pick ▲ / ♛ on the map to build.'};
    if(UI.sac==null)return {label:o.kind==='crown'?'Crown it':'Build floor',dis:true,note:'Pick a tile from your hand to repurpose.'};
    return {label:`${o.kind==='crown'?'Crown it':'Build floor'} · ${money(o.cost)}`,act:'build'}}
  if(S.phase==='post')return {label:UI.endArm?'Yes, end my turn':'End turn',act:'end',danger:UI.endArm,
    warn:UI.endArm?(S.bought?`You can still buy ${plural(p.buyMax-S.bought,'more share')} this turn. End anyway?`:'End your turn without buying stock?'):''};
  return null}

// pick a tile to place (from the hand or the map); a merger tile opens the merger forecast right away
function selectTile(t){
  if(S.sel===t){S.sel=null;UI.ftype=null;return}
  S.sel=t;UI.ftype=null;
  if(isBattle(t)){const ty=zoneRoll(t);if(sisterChoice(t)&&S.leadPick==null)S.dp={t,type:ty};else S.pm={t,type:ty,fc:forecast(t,ty)}}
}
const UI_ACTS=['bm-steal-from','cog','abandon','close','skip','new','ftrade','fdone','mydir','panel','ticker','tsort','closeinsp','pslot','unpin','legend','inspco','tick','untick','focus'];
function act(a,el){
  const p=cur();
  if(RUN&&/^(draft|run-start|hq|new-run|to-hq|fair)/.test(a)){runAct(a,el);renderAll();return}
  if(isAI(p)&&!UI_ACTS.includes(a)&&!(S.pm?.ai&&a==='commence')&&!(S.dp?.ai&&a==='leadpick'))return;
  if(!['tick','untick','tsort','ticker','end','buy'].includes(a))UI.endArm=false;
  if(a!=='abandon')UI.abandonArm=false;
  S.msg='';
  switch(a){
    case 'pick':{const t=+el.dataset.t;
      if(S.phase==='tower'){if(chosenBuild()&&p.hand.includes(t))UI.sac=UI.sac===t?null:t;break}
      if(S.phase!=='place')break;
      if(devMode(p)?!expandSpots(p).includes(t):!(p.hand.includes(t)&&canPlay(t)))break;
      selectTile(t);break}
    case 'ftype':if(ORDER.includes(el.dataset.t))UI.ftype=el.dataset.t;break;
    case 'placecancel':S.sel=null;UI.ftype=null;break;
    case 'place':{if(S.sel==null)break;const ty=el.dataset.t==='?'?zoneRoll(S.sel):el.dataset.t;if(!ORDER.includes(ty))break;UI.ftype=null;
      if(sisterChoice(S.sel)&&S.leadPick==null){S.dp={t:S.sel,type:ty};break}
      if(isBattle(S.sel))S.pm={t:S.sel,type:ty,fc:forecast(S.sel,ty)};else{save();placeTile(S.sel,ty)}break}
    case 'sell':{const id=el.dataset.c;if(!canSell(p,id))break;save();const pr=sellPrice(p,id);p.cash+=pr;p.shares[id]--;if(!p.shares[id])delete p.shares[id];S.comps[id].sold--;S.sold=(S.sold||0)+1;ledger(p,id).got+=pr;log(`${p.name} sold 1 share of ${S.comps[id].name} back to the bank for ${money(pr)}.`);break}
    case 'bm-pump':{const c=S.comps[el.dataset.c];if(!BM('bullhorn')||!c?.alive||S.used?.pump||!myTurn())break;save();S.pump={id:c.id,until:S.round+RUNCFG.pumpRounds};S.used.pump=true;log(`The Bull Horn hypes ${c.name}: its share price is up ${Math.round(RUNCFG.pump*100)}% until round ${S.pump.until}.`);break}
    case 'bm-rezone':UI.rezone=!UI.rezone&&BM('commish')&&!S.used?.commish&&myTurn();UI.rezoneAt=null;break;
    case 'bm-rezone-type':{const i=UI.rezoneAt,t=el.dataset.t;if(i==null||!ORDER.includes(t)||S.used?.commish||!myTurn())break;save();const g=S.grid[i],old=g.f[0],c=g.c!=null?S.comps[g.c]:null;
      g.f=g.f.map(()=>t);if(c&&c.cap&&c.capAt===i)c.cap=t;capDedupe();S.used.commish=true;UI.rezone=false;UI.rezoneAt=null;
      log(`The Zoned-Out Commissioner rezoned ${coord(i)}${c?` (${c.name})`:''} from ${TYPES[old].name} to ${TYPES[t].name}${g.f.length>1?`, tower${g.crown?' and capstone':''} included`:''}.`);break}
    case 'bm-unpaid':{const c=S.comps[el.dataset.c];if(!BM('unpaid')||S.used?.unpaid||!c?.alive||c.owner!==0||!myTurn())break;const n=capacity(c)-units(c);if(n<=0)break;save();c.stack[S.dirs[c.dir].spec]+=n;S.used.unpaid=true;log(`The Unpaid Intern staffed ${c.name} with ${n} ${TYPES[S.dirs[c.dir].spec].unit}, free of charge.`);break}
    case 'bm-steal-from':UI.stealFrom=+el.dataset.i<0?null:+el.dataset.i;break;
    case 'bm-steal':{const q=S.players[UI.stealFrom],t=+el.dataset.t,me=S.players[0];if(!BM('fivefinger')||!q||S.used?.steal||!q.hand.includes(t)||!myTurn())break;save();q.hand.splice(q.hand.indexOf(t),1);me.hand.push(t);refill(q);S.used.steal=true;UI.stealFrom=null;log(`The Five-Finger Discount lifted ${coord(t)} from ${poss(q.name)} hand.`);break}
    case 'nepo-dir':UI.nepoDir=el.dataset.d;break;
    case 'nepo-type':if(ORDER.includes(el.dataset.t))UI.nepoType=el.dataset.t;break;
    case 'nepo-go':{if(!S.nepoPending||!UI.nepoDir||!UI.nepoType)break;buildNepo(UI.nepoDir,UI.nepoType);S.nepoPending=false;UI.nepoDir=null;UI.nepoType=null;break}

    case 'commence':{const m=S.pm;S.pm=null;placeTile(m.t,m.type);if(!m.ai){UNDO=[];S.msg='The merger is final.'}break}
    case 'leadpick':{const m=S.dp;if(!m)break;S.dp=null;S.leadPick=el.dataset.d;
      if(m.ai){if(isBattle(m.t)||playerStake(m.t))S.pm={t:m.t,type:m.type,ai:true,fc:isBattle(m.t)?forecast(m.t,m.type):null};else placeTile(m.t,m.type)}
      else if(isBattle(m.t))S.pm={t:m.t,type:m.type,fc:forecast(m.t,m.type)};else{save();placeTile(m.t,m.type)}break}
    case 'leadcancel':S.dp=null;S.leadPick=null;S.sel=null;break;
    case 'cancelmerge':S.pm=null;S.leadPick=null;S.sel=null;S.msg='Merger called off. Pick a different tile.';break;
    case 'ffocus':if(FOCUS[el.dataset.f])S.foundFocus=el.dataset.f;break;
    case 'found':save();found(el.dataset.d,S.foundFocus);break;
    case 'bpick':{const i=+el.dataset.t;if(S.phase==='tower'&&buildMap().has(i)){S.tTarget=S.tTarget===i?null:i;UI.sac=null}break}
    case 'bcancel':S.tTarget=null;UI.sac=null;break;
    case 'build':{const o=chosenBuild();if(S.phase==='tower'&&o&&UI.sac!=null&&p.hand.includes(UI.sac)){save();if(o.kind==='crown')crownTower(UI.sac,o.i);else buildFloor(UI.sac,o.i)}UI.sac=null;break}
    case 'skiptower':if(S.phase==='tower'){clearTowerUI();UI.sac=null;S.phase='post'}break;
    case 'focus':{const c=S.comps[el.dataset.c];if(c&&c.owner===0&&!isAI(p)&&FOCUS[el.dataset.f]&&c.focus!==el.dataset.f){c.focus=el.dataset.f;log(`${c.name} switched to ${FOCUS[c.focus].name}.`)}break}
    case 'buy':{const c=S.comps[el.dataset.c];if(c?.alive&&S.phase==='post'&&S.bought<p.buyMax&&CFG.shares-c.sold>0&&p.cash>=costOf(p,c.id)){save();buy(c.id);UI.endArm=false}break}
    case 'tick':S.tick=S.tick===el.dataset.c?null:el.dataset.c;if(S.tick)UI.ticker=true;break;
    case 'untick':S.tick=null;break;
    case 'undo':if(UNDO.length){S=JSON.parse(UNDO.pop());BT=null;UI.sac=null;UI.ftype=null;UI.rezone=false;UI.rezoneAt=null;UI.stealFrom=null;S.msg='Undone.'}break;
    case 'end':{if(S.phase!=='post'||p.i!==0)break;if(canBuyAny(p)&&!UI.endArm){UI.endArm=true;break}UI.endArm=false;S.tick=null;endTurn();break}
    case 'new':newGame();break;
    case 'skip':BT.k=BT.r.rounds.length-1;clearInterval(BT.timer);break;
    case 'close':clearInterval(BT.timer);S.queue.shift();BT=null;break;
    case 'mydir':{const c=S.comps[el.dataset.c];if(c){S.insp=c.hq;UI.inspOpen=true;S.tick=c.id}break}
    case 'inspco':{const c=S.comps[el.dataset.c];if(c){S.insp=c.hq;UI.inspOpen=true}break}
    case 'closeinsp':UI.inspOpen=false;break;
    case 'panel':UI.panel=UI.panel===el.dataset.p?null:el.dataset.p;break;
    case 'ticker':UI.ticker=!UI.ticker;break;
    case 'tsort':UI.sort=el.dataset.s;break;
    case 'pslot':{const i=+el.dataset.i;UI.pin=UI.pin===i?null:i;break}
    case 'unpin':UI.pin=null;break;
    case 'legend':UI.legend=!UI.legend;if(UI.legend)UI.cog=false;break;
    case 'ftrade':{const r=S.queue[0];if(r?.kind==='friendly'&&r.pend){const mx=tradeMax(r.win,r.pend.n,r.pend.pr);r.k=Math.max(0,Math.min(mx,(r.k||0)+(+el.dataset.d)))}break}
    case 'fdone':{const r=S.queue[0];if(r?.kind!=='friendly')break;if(r.pend){const P=r.pend;LEDGER=r.money;settleTrade(S.players[0],P.lose,P.win,P.n,el.dataset.all?0:(r.k||0),P.pr);LEDGER=null}S.queue.shift();break}
  }
  renderAll();
}
// a click on the map: act on a glowing tile or a ▲/♛ during your turn; otherwise open the company card (and its ticker entry)
function boardClick(i){const p=cur(),g=S.grid[i],my=myTurn();UI.endArm=false;S.msg='';
  if(UI.rezone&&my){if(g.placed&&!g.wild)UI.rezoneAt=i;else S.msg='Pick a zoned lot (not open land or a ? lot).';renderAll();return}
  if(my&&S.phase==='place'&&(devMode(p)?expandSpots(p).includes(i):p.hand.includes(i)&&canPlay(i))){selectTile(i);renderAll();return}
  if(my&&S.phase==='tower'&&buildMap().has(i)){S.tTarget=S.tTarget===i?null:i;UI.sac=null;renderAll();return}
  if(my&&S.phase==='tower'&&chosenBuild()&&p.hand.includes(i)){UI.sac=UI.sac===i?null:i;renderAll();return}
  if(g.placed){S.insp=i;UI.inspOpen=true;if(g.c!=null&&(UI.ticker||S.phase==='post'))S.tick=g.c}
  renderAll();
}
function hoverCell(t,on){HOVER=on?+t:null;if(ISO_ST)drawIso(ISO_ST)}

// ===================== 6. START-UP =====================
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b)});
// hovering a line or end dot on the ticker lights up that company's line and shows its name
function tickHover(e,on){const t=e.target.closest&&e.target.closest('#ticker [data-c]');if(!t)return;for(const g of document.querySelectorAll(`#ticker g[data-g="${t.dataset.c}"]`))g.classList.toggle('hov',on)}
document.addEventListener('mouseover',e=>tickHover(e,true));document.addEventListener('mouseout',e=>tickHover(e,false));
// hovering a hand card lights up its space on the map
document.addEventListener('mouseover',e=>{const b=e.target.closest('.hcard[data-act="pick"]');if(b)hoverCell(b.dataset.t,true);
  const ps=e.target.closest('.pslot');if(ps&&UI.hover!==+ps.dataset.i){UI.hover=+ps.dataset.i;renderPlayerPop()}});
document.addEventListener('mouseout',e=>{const b=e.target.closest('.hcard[data-act="pick"]');if(b)hoverCell(b.dataset.t,false);
  if(e.target.closest('#players')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#players'))){UI.hover=null;renderPlayerPop()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(UI.pin!=null)UI.pin=null;else if(UI.cog)UI.cog=false;else if(UI.legend)UI.legend=false;else if(UI.inspOpen)UI.inspOpen=false;else if(UI.panel)UI.panel=null;else return;renderAll()});
setupIso();
loadMeta();newRun();renderAll();
</script>
